<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>情報工学基礎 — スプレッドシート実習</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Noto Sans JP', sans-serif; }
    body { background: #fff; color: #0a0a0a; }
    .formula-box {
      background: #0a0a0a; color: #4ade80;
      font-family: 'Courier New', monospace; font-size: 13px;
      padding: 8px 14px; border-radius: 6px; display: inline-block;
    }
    .cell { border: 1px solid #d4d4d4; padding: 8px 12px; }
    .cell-head { background: #f4f4f4; font-weight: 700; font-size: 11px; color: #666; text-transform: uppercase; letter-spacing:.05em; }
    .cell-sum  { background: #f0fdf4; color: #16a34a; font-weight: 700; }
    .cell-num  { border: none; background: transparent; width: 100%; text-align: right; outline: none; }
    .cell-num:focus { background: #fffbeb; }
    select.ss { border: none; background: transparent; width: 100%; cursor: pointer; outline: none; font-size: 13px; font-weight: 600; }
    @keyframes fadein { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .fadein { animation: fadein .25s ease-out; }
    @keyframes aipulse { 0%,100%{opacity:.4} 50%{opacity:1} }
    .ai-pulse { animation: aipulse 1.2s ease-in-out infinite; }
    .tag { font-size: 11px; font-weight: 700; letter-spacing:.08em; text-transform: uppercase; }
    .step-nav-btn { transition: all .15s; }
    .timeline-dot-active { background: #0a0a0a; }
    .timeline-dot-done   { background: #16a34a; }
    .timeline-dot-inactive { background: #e5e5e5; }

    /* チャレンジカード */
    .challenge-card { border-left: 4px solid #0a0a0a; background: #f9f9f9; padding: 14px 16px; border-radius: 0 8px 8px 0; }
    .advance-card   { border-left: 4px solid #7c3aed; background: #faf5ff; padding: 14px 16px; border-radius: 0 8px 8px 0; }
    /* チェックボックス風 */
    .check-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; cursor: pointer; }
    .check-box  { width: 18px; height: 18px; border: 2px solid #d4d4d4; border-radius: 3px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; }
    .check-box.done { border-color: #16a34a; background: #16a34a; }

    /* ステータス配色 */
    .s-todo  { background: #f3f4f6; color: #4b5563; border-color: #d1d5db; }
    .s-doing { background: #eff6ff; color: #1d4ed8; border-color: #93c5fd; }
    .s-done  { background: #f0fdf4; color: #16a34a; border-color: #86efac; }
  </style>
</head>
<body class="bg-white min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useCallback } = React;

/* ── utils ── */
const today = new Date(); today.setHours(0,0,0,0);
const offset = d => { const x=new Date(today); x.setDate(x.getDate()+d); return x.toISOString().split('T')[0]; };
const diff   = s => { if(!s) return null; const t=new Date(s); t.setHours(0,0,0,0); return Math.ceil((t-today)/86400000); };
const fmtDate = s => { if(!s) return ''; const d=new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const comma = n => Number(n).toLocaleString();

/* ── 共通UI ── */
const Formula = ({children}) => <span className="formula-box">{children}</span>;
const Tag = ({children,color='black'}) => (
  <span className={`tag text-xs px-2 py-0.5 rounded-full border-2 ${
    color==='green'  ? 'border-green-600 text-green-700' :
    color==='purple' ? 'border-purple-600 text-purple-700' :
    color==='red'    ? 'border-red-600 text-red-700' :
    'border-black text-black'
  }`}>{children}</span>
);

/* チェックリスト（実習手順） */
function Checklist({items}) {
  const [done, setDone] = useState(items.map(()=>false));
  return (
    <div>
      {items.map((item,i)=>(
        <div key={i} className="check-item" onClick={()=>setDone(d=>{const x=[...d];x[i]=!x[i];return x;})}>
          <div className={`check-box ${done[i]?'done':''}`}>{done[i]&&<span className="text-white text-xs font-black">✓</span>}</div>
          <span className={`text-sm leading-snug ${done[i]?'line-through text-gray-400':''}`}>{item}</span>
        </div>
      ))}
    </div>
  );
}

/* 発展課題カード */
function AdvCard({emoji,title,desc,formula}) {
  return (
    <div className="advance-card mb-3">
      <div className="flex items-center gap-2 mb-1">
        <span>{emoji}</span>
        <span className="font-bold text-sm text-purple-800">{title}</span>
      </div>
      <p className="text-xs text-gray-600 mb-2">{desc}</p>
      {formula && <Formula>{formula}</Formula>}
    </div>
  );
}

/* 関数の構造解説カード */
function SyntaxCard({items}) {
  const CLS = {gray:'bg-gray-700',green:'bg-green-600',blue:'bg-blue-500',orange:'bg-orange-500',red:'bg-red-500',purple:'bg-purple-600'};
  return (
    <div className="border-2 border-black rounded-xl overflow-hidden mb-4">
      <div className="bg-gray-950 px-4 py-3 font-mono text-sm flex flex-wrap gap-1 items-baseline leading-loose">
        {items.map((it,i)=>
          it.label
            ? <span key={i} className={`px-1.5 py-0.5 rounded font-bold text-white text-xs ${CLS[it.color]||'bg-gray-600'}`}>{it.text}</span>
            : <span key={i} className="text-gray-300">{it.text}</span>
        )}
      </div>
      <div className="divide-y divide-gray-100">
        {items.filter(it=>it.label).map((it,i)=>(
          <div key={i} className="flex items-start gap-3 px-4 py-2">
            <span className={`flex-shrink-0 font-mono text-xs font-bold px-2 py-0.5 rounded text-white ${CLS[it.color]||'bg-gray-600'}`}>{it.text}</span>
            <div>
              <span className="font-bold text-sm">{it.label}</span>
              {it.desc&&<p className="text-xs text-gray-500 mt-0.5">{it.desc}</p>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ステータス select */
function StatusSelect({value, onChange}) {
  const cls = value==='完了' ? 's-done' : value==='進行中' ? 's-doing' : 's-todo';
  return (
    <select value={value} onChange={e=>onChange(e.target.value)}
      className={`ss rounded-lg px-2 py-1 border ${cls}`}>
      <option>未着手</option><option>進行中</option><option>完了</option>
    </select>
  );
}

/* ══════════════════════════════════════════════
   導入パネル（全体概要）
══════════════════════════════════════════════ */
function Intro({onStart}) {
  const timeline = [
    { time:'0–5分',   label:'導入', desc:'完成形を見て、今日のゴールを確認', step:'このサイト' },
    { time:'5–20分',  label:'STEP 1', desc:'SUM/AVERAGE：予算表を作る', step:'基本' },
    { time:'20–35分', label:'STEP 2', desc:'IF/IFS：条件で自動判定', step:'基本' },
    { time:'35–50分', label:'STEP 3', desc:'COUNTIF：集計して可視化', step:'基本' },
    { time:'50–70分', label:'STEP 4', desc:'プルダウン＋条件付き書式', step:'実践' },
    { time:'70–85分', label:'STEP 5', desc:'完成形：タスク管理シートを仕上げる', step:'実践' },
    { time:'85–90分', label:'STEP 6', desc:'発展：グラフ・SPARKLINE・AI関数', step:'発展' },
  ];
  return (
    <div className="fadein">
      <div className="mb-8">
        <Tag>今日のゴール</Tag>
        <h2 className="text-3xl font-black mt-3 mb-2 leading-tight">
          スプレッドシートで<br/>「自動で動く」シートを作ろう
        </h2>
        <p className="text-gray-500 text-sm max-w-xl">
          まるごと祭の準備をテーマに、関数・プルダウン・条件付き書式を学ぶ。
          最終的には<strong className="text-black">期限が近づいたら自動で色が変わる</strong>タスク管理シートが完成する。
        </p>
      </div>

      {/* 到達目標 */}
      <div className="grid grid-cols-3 gap-3 mb-8">
        {[
          { level:'合格', color:'bg-gray-100 border-gray-300', icon:'📋', desc:'プルダウン設定＋ステータスで色変え', sub:'全員ここまで' },
          { level:'良',   color:'bg-blue-50 border-blue-200',  icon:'📊', desc:'COUNTIF/IFで自動集計・自動判定', sub:'目標ライン' },
          { level:'優',   color:'bg-green-50 border-green-200',icon:'✨', desc:'グラフ/SPARKLINE/AI関数に挑戦', sub:'できたら発展へ' },
        ].map(r=>(
          <div key={r.level} className={`border-2 rounded-xl p-4 ${r.color}`}>
            <div className="text-2xl mb-2">{r.icon}</div>
            <div className="font-black text-lg mb-1">{r.level}</div>
            <div className="text-xs text-gray-600 mb-2">{r.desc}</div>
            <div className="tag text-gray-400">{r.sub}</div>
          </div>
        ))}
      </div>

      {/* タイムライン */}
      <div className="border-2 border-black rounded-xl overflow-hidden mb-8">
        <div className="bg-black text-white px-5 py-3">
          <span className="font-black">90分タイムライン</span>
        </div>
        <div>
          {timeline.map((t,i)=>(
            <div key={i} className={`flex items-center gap-4 px-5 py-3 border-b border-gray-100 last:border-0 ${i===0?'bg-green-50':''}`}>
              <div className="w-20 flex-shrink-0 font-mono text-xs text-gray-400">{t.time}</div>
              <div className="w-20 flex-shrink-0">
                <span className={`tag text-xs px-2 py-0.5 rounded-full whitespace-nowrap ${
                  t.step==='基本' ? 'bg-black text-white' :
                  t.step==='実践' ? 'bg-gray-700 text-white' :
                  t.step==='発展' ? 'bg-purple-700 text-white' :
                  'bg-green-100 text-green-700'
                }`}>{t.step}</span>
              </div>
              <div className="flex-1">
                <span className="font-bold text-sm">{t.label}</span>
                <span className="text-gray-500 text-xs ml-2">{t.desc}</span>
              </div>
            </div>
          ))}
        </div>
      </div>

      <button
        onClick={onStart}
        className="w-full py-4 bg-black text-white rounded-xl font-black text-lg hover:bg-gray-800 transition-colors"
      >
        STEP 1 からはじめる →
      </button>
    </div>
  );
}

/* ══════════════════════════════════════════════
   STEP 1 — SUM / AVERAGE
══════════════════════════════════════════════ */
const BUDGET = [
  { name:'材料費（チュロス）', budget:15000 },
  { name:'備品費（容器・袋）', budget:5000 },
  { name:'看板・ポスター印刷', budget:3000 },
  { name:'ユニフォーム',       budget:8000 },
  { name:'その他雑費',         budget:2000 },
];

function Step1() {
  const [spent, setSpent] = useState([12000,4800,2500,0,800]);
  const totalB = BUDGET.reduce((a,b)=>a+b.budget,0);
  const totalS = spent.reduce((a,b)=>a+b,0);
  const totalL = totalB - totalS;
  const avg    = Math.round(totalS / spent.filter(v=>v>0).length || 0);

  return (
    <div className="fadein">
      <div className="mb-5">
        <Tag>STEP 1</Tag>
        <h2 className="text-2xl font-black mt-2 mb-1">SUM・AVERAGE — 合計と平均</h2>
        <p className="text-gray-500 text-sm">
          数字を手で足し算するのは非効率。<strong className="text-black">関数を使えば何百行でも一瞬で計算</strong>でき、数字を変えると自動で再計算される。
        </p>
      </div>

      <div className="flex gap-3 flex-wrap mb-4">
        <div><Formula>=SUM(C2:C6)</Formula><span className="text-xs text-gray-400 ml-2">← 支出の合計</span></div>
        <div><Formula>=AVERAGE(C2:C6)</Formula><span className="text-xs text-gray-400 ml-2">← 支出の平均</span></div>
      </div>

      <p className="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">🔍 関数の構造を読み解こう</p>
      <SyntaxCard items={[
        {text:'=',label:null},
        {text:'SUM',label:'関数名',desc:'何をするかの命令。SUM ＝「合計する」　（AVERAGEなら「平均を出す」）',color:'gray'},
        {text:'(',label:null},
        {text:'B2',label:'範囲の始まり',desc:'合計したい最初のセル番地（行・列で1つのマスを指定）',color:'green'},
        {text:' : ',label:'コロン「 : 」',desc:'「〜から〜まで」を表す記号。始まりと終わりのセルをつなぐ',color:'blue'},
        {text:'B6',label:'範囲の終わり',desc:'合計したい最後のセル番地',color:'orange'},
        {text:')',label:null},
      ]} />

      <div className="border-2 border-black rounded-xl overflow-hidden mb-5">
        <table className="w-full text-sm border-collapse">
          <thead>
            <tr>
              <th className="cell cell-head text-left">品目</th>
              <th className="cell cell-head text-right">予算</th>
              <th className="cell cell-head text-right">支出（編集可）</th>
              <th className="cell cell-head text-right">残額</th>
            </tr>
          </thead>
          <tbody>
            {BUDGET.map((item,i)=>{
              const left = item.budget - spent[i];
              return (
                <tr key={i}>
                  <td className="cell">{item.name}</td>
                  <td className="cell text-right text-gray-400">{comma(item.budget)}</td>
                  <td className="cell text-right">
                    <input type="number" className="cell-num" value={spent[i]} min={0}
                      onChange={e=>{const v=[...spent];v[i]=Number(e.target.value)||0;setSpent(v);}} />
                  </td>
                  <td className={`cell text-right font-bold ${left<0?'text-red-600 bg-red-50':'text-gray-700'}`}>{comma(left)}</td>
                </tr>
              );
            })}
          </tbody>
          <tfoot>
            <tr className="border-t-2 border-black">
              <td className="cell cell-head font-black">合計 / 平均</td>
              <td className="cell cell-sum text-right">{comma(totalB)}</td>
              <td className="cell text-right bg-yellow-50 font-bold">
                <div>{comma(totalS)}</div>
                <div className="text-xs text-gray-400">平均: {comma(avg)}</div>
              </td>
              <td className={`cell text-right font-black text-base ${totalL<0?'bg-red-50 text-red-600':'cell-sum'}`}>{comma(totalL)}</td>
            </tr>
          </tfoot>
        </table>
      </div>

      {/* 実習ガイド */}
      <div className="challenge-card mb-4">
        <div className="flex items-center gap-2 mb-3">
          <span className="font-black text-sm">📋 Googleスプレッドシートでやってみよう</span>
          <Tag>実習</Tag>
        </div>
        <Checklist items={[
          'A1〜D1に「品目」「予算」「支出」「残額」と入力する',
          'A2〜A6に品目名を入力する（何でもOK）',
          'B2〜B6に予算の金額を入力する',
          'C2〜C6に支出の金額を入力する',
          'B7に =SUM(B2:B6) と入力して合計を出す',
          'D2に =B2-C2 と入力して残額を計算し、D6までコピーする',
          '【発展】C7に =AVERAGE(C2:C6) で平均支出を出す',
        ]} />
      </div>

      <div className="bg-gray-50 border border-gray-200 rounded-xl p-4 text-sm">
        <strong>💡 ポイント:</strong> 支出の数字を変えると合計・残額が即座に更新されます。残額がマイナスになると自動で赤くなるのは、次のステップで学ぶ「<strong>条件付き書式</strong>」です。
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   STEP 2 — IF / IFS
══════════════════════════════════════════════ */
const SCORE_DATA = [
  { name:'田中', task:'申請書の提出',     deadline: offset(-1), done: false },
  { name:'鈴木', task:'試作品の試食',     deadline: offset(2),  done: false },
  { name:'山田', task:'材料の調達',       deadline: offset(6),  done: false },
  { name:'佐藤', task:'看板デザイン完成', deadline: offset(8),  done: true  },
  { name:'伊藤', task:'原価計算',         deadline: offset(12), done: false },
];

function Step2() {
  const [rows, setRows] = useState(SCORE_DATA.map(r=>({...r})));

  function judge(r) {
    if(r.done) return { text:'✅ 完了',     cls:'text-green-600 font-bold' };
    const d = diff(r.deadline);
    if(d < 0)  return { text:'🚨 期限切れ', cls:'text-red-600 font-bold' };
    if(d <= 3) return { text:'⚠️ まもなく', cls:'text-amber-600 font-bold' };
    return       { text:'🟢 余裕あり',      cls:'text-gray-500' };
  }

  return (
    <div className="fadein">
      <div className="mb-5">
        <Tag>STEP 2</Tag>
        <h2 className="text-2xl font-black mt-2 mb-1">IF / IFS — 条件で結果を切り替え</h2>
        <p className="text-gray-500 text-sm">
          「もし〇〇なら△△、そうでなければ××」という<strong className="text-black">条件分岐</strong>を関数で書く。プログラミングの if 文と同じ考え方。
        </p>
      </div>

      <div className="space-y-3 mb-5">
        <div>
          <Formula>=IF(D2="完了","✅ 完了", IF(E2&lt;TODAY(),"🚨 期限切れ","🟢 余裕あり"))</Formula>
          <p className="text-xs text-gray-400 mt-1 ml-1">IFを入れ子にして複数条件を判定</p>
        </div>
        <div>
          <Formula>=IFS(D2="完了","✅ 完了", E2&lt;TODAY(),"🚨 期限切れ", TRUE,"🟢 余裕あり")</Formula>
          <p className="text-xs text-gray-400 mt-1 ml-1">IFS関数を使うとすっきり書ける（発展）</p>
        </div>
      </div>

      <p className="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2">🔍 IF 関数の3つの部品</p>
      <SyntaxCard items={[
        {text:'=IF(',label:null},
        {text:'D2="完了"',label:'① 条件（論理式）',desc:'TRUEかFALSEになる比較式。「もし〇〇なら」の〇〇部分',color:'orange'},
        {text:' , ',label:null},
        {text:'"✅ 完了"',label:'② TRUEのとき（真）',desc:'条件が正しかったとき（TRUE）にセルへ表示する値',color:'green'},
        {text:' , ',label:null},
        {text:'"❌ 未完了"',label:'③ FALSEのとき（偽）',desc:'条件が間違っていたとき（FALSE）にセルへ表示する値',color:'red'},
        {text:')',label:null},
      ]} />
      <div className="bg-gray-50 border border-gray-200 rounded-xl p-4 mb-5">
        <p className="font-bold text-xs mb-3">比較演算子 — 条件式で使う記号</p>
        <div className="grid grid-cols-3 gap-3 text-xs">
          {[['=','等しい','A2="完了"'],['<>','等しくない','A2<>"完了"'],['>','より大きい','B2>100'],
            ['<','より小さい','C2<TODAY()'],['>=','以上','C2>=60'],['<=','以下','C2<=3']].map(([op,desc,ex])=>(
            <div key={op} className="space-y-0.5">
              <div className="font-mono font-black text-base">{op}</div>
              <div className="text-gray-600">{desc}</div>
              <div className="font-mono text-gray-400">{ex}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="border-2 border-black rounded-xl overflow-hidden mb-5">
        <table className="w-full text-sm border-collapse">
          <thead>
            <tr>
              <th className="cell cell-head text-left">担当</th>
              <th className="cell cell-head text-left">タスク</th>
              <th className="cell cell-head text-center">期限</th>
              <th className="cell cell-head text-center">完了？</th>
              <th className="cell cell-head text-center bg-black text-white">IF の結果</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r,i)=>{
              const j = judge(r);
              const d = diff(r.deadline);
              return (
                <tr key={i} className={r.done?'opacity-50':''}>
                  <td className="cell font-medium">{r.name}</td>
                  <td className={`cell ${r.done?'line-through text-gray-400':''}`}>{r.task}</td>
                  <td className={`cell text-center text-sm ${!r.done&&d<0?'text-red-600 font-bold':!r.done&&d<=3?'text-amber-600 font-bold':'text-gray-500'}`}>
                    {fmtDate(r.deadline)}
                  </td>
                  <td className="cell text-center">
                    <input type="checkbox" checked={r.done} className="w-4 h-4 cursor-pointer"
                      onChange={()=>{const rs=[...rows];rs[i]={...rs[i],done:!rs[i].done};setRows(rs);}} />
                  </td>
                  <td className={`cell text-center bg-gray-50 ${j.cls}`}>{j.text}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="challenge-card mb-4">

const STEP4_TASKS = [

];

function rowBg(t) {
  if(t.status==='完了') return 'bg-green-50 opacity-60';
  const d = diff(t.deadline);
  if(d<0) return 'bg-red-50';
  if(d<=3) return 'bg-amber-50';
  return '';
}
function dlStyle(t) {
  if(t.status==='完了') return 'text-gray-400';
  const d=diff(t.deadline);
  if(d<0) return 'text-red-600 font-bold';
  if(d<=3) return 'text-amber-600 font-bold';
  return 'text-gray-500';
}

function CodeBlock({code}) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    navigator.clipboard.writeText(code).then(()=>{
      setCopied(true); setTimeout(()=>setCopied(false),1500);
    });
  };
  return (
    <div className="relative mt-2 mb-1">
      <pre className="bg-gray-950 text-green-400 text-xs rounded-xl p-4 overflow-x-auto leading-relaxed font-mono">{code}</pre>
      <button onClick={copy}
        className="absolute top-2 right-2 text-xs bg-gray-800 text-gray-300 px-2 py-1 rounded hover:bg-gray-700 transition-colors">
        {copied ? '✓ コピー済' : 'コピー'}
      </button>
    </div>
  );
}

}

/* ══════════════════════════════════════════════
   メインアプリ
══════════════════════════════════════════════ */
const STEPS_DEF = [
  { id:0,  label:'導入',    short:'90分の流れ',    color:'green' },
  { id:1,  label:'SUM/AVG', short:'合計・平均',    color:'black' },
  { id:2,  label:'IF/IFS',  short:'条件判定',      color:'black' },
  { id:3,  label:'COUNTIF', short:'集計',          color:'black' },
  { id:4,  label:'書式',    short:'プルダウン・色', color:'black' },
  { id:5,  label:'完成形',  short:'タスク管理',    color:'green' },
  { id:6,  label:'発展',    short:'グラフ・AI',    color:'purple' },
];

function App() {
  const [step, setStep] = useState(0);

  const content = [
    <Intro onStart={()=>setStep(1)} />,
    <Step1 />, <Step2 />, <Step3 />, <Step4 />, <Step5 />, <Step6 />,
  ][step];

  return (
    <div className="min-h-screen bg-white">
      {/* トップバー */}
      <div className="border-b-2 border-black sticky top-0 bg-white z-10">
        <div className="max-w-3xl mx-auto px-5 py-3 flex items-center justify-between">
          <div>
            <div className="tag text-gray-400 text-xs">情報工学基礎 — 神山まるごと高専</div>
            <h1 className="text-base font-black">スプレッドシート実習</h1>
          </div>
          <div className="text-xs text-gray-400">
            <span className="font-mono text-black">=TODAY()</span>
            <span className="ml-1">{today.getFullYear()}/{today.getMonth()+1}/{today.getDate()}</span>
          </div>
        </div>
      </div>

      {/* ステップナビ */}
      <div className="border-b border-gray-100 bg-gray-50">
        <div className="max-w-3xl mx-auto px-5 py-3 overflow-x-auto">
          <div className="flex gap-1.5 min-w-max">
            {STEPS_DEF.map(s=>(
              <button key={s.id} onClick={()=>setStep(s.id)}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-all step-nav-btn whitespace-nowrap ${
                  step===s.id
                    ? s.color==='purple' ? 'bg-purple-700 text-white'
                    : s.color==='green'  ? 'bg-green-600 text-white'
                    : 'bg-black text-white'
                    : step>s.id && s.id>0
                    ? 'bg-green-100 text-green-700 border border-green-200'
                    : 'bg-white border border-gray-200 text-gray-400 hover:border-black hover:text-black'
                }`}>
                <span className="text-xs opacity-60">{step>s.id&&s.id>0?'✓':s.id===0?'▶':s.id}</span>
                <span>{s.label}</span>
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* コンテンツ */}
      <div className="max-w-3xl mx-auto px-5 py-8">
        {content}

        {/* 前後ボタン */}
        <div className="flex justify-between mt-10 pt-6 border-t-2 border-gray-100">
          <button onClick={()=>setStep(s=>Math.max(0,s-1))} disabled={step===0}
            className="px-5 py-2.5 border-2 border-gray-200 rounded-xl text-sm font-bold text-gray-400 hover:border-black hover:text-black disabled:opacity-30 disabled:cursor-not-allowed transition-all">
            ← 前へ
          </button>
          <div className="flex gap-1 items-center">
            {STEPS_DEF.map(s=>(
              <button key={s.id} onClick={()=>setStep(s.id)}
                className={`rounded-full transition-all ${
                  step===s.id?'w-6 h-2 bg-black':step>s.id?'w-2 h-2 bg-green-400':'w-2 h-2 bg-gray-200'
                }`} />
            ))}
          </div>
          <button onClick={()=>setStep(s=>Math.min(6,s+1))} disabled={step===6}
            className="px-5 py-2.5 bg-black text-white rounded-xl text-sm font-bold hover:bg-gray-800 disabled:opacity-30 disabled:cursor-not-allowed transition-all">
            次へ →
          </button>
        </div>
      </div>

      <div className="border-t-2 border-black">
        <div className="max-w-3xl mx-auto px-5 py-4 flex justify-between text-xs text-gray-300">
          <span>情報工学基礎 スプレッドシート実習</span>
          <span>神山まるごと高専</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
